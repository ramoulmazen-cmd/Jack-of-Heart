<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <!-- Jack of Hearts, an original court card for the game. A young man behind a gold mask, in a
       crimson beret with a gold plume, framed by a heart-shaped halo under an art-deco arch.
       Narrow red eyes, sharp brows, a thin smile: the same Jack as the mark on the card backs.
       assets/jack-card.png is this, rendered at 600 x 840. -->
  <defs>
    <path id="heart" d="M50 92 C 20 66, 0 47, 0 27 C 0 11, 12 0, 27 0 C 38 0, 46 7, 50 17 C 54 7, 62 0, 73 0 C 88 0, 100 11, 100 27 C 100 47, 80 66, 50 92 Z"/>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1C1"/>
      <stop offset="0.3" stop-color="#E8BC4E"/>
      <stop offset="0.62" stop-color="#A2731A"/>
      <stop offset="1" stop-color="#F6D98A"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1C1"/>
      <stop offset="0.45" stop-color="#E0AE3E"/>
      <stop offset="1" stop-color="#8E6214"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3C8"/>
      <stop offset="0.35" stop-color="#EFC45A"/>
      <stop offset="0.75" stop-color="#B07E1E"/>
      <stop offset="1" stop-color="#7A5410"/>
    </linearGradient>
    <radialGradient id="field" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#7A1426"/>
      <stop offset="0.42" stop-color="#330910"/>
      <stop offset="1" stop-color="#0A0405"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#E8344E"/>
      <stop offset="0.55" stop-color="#A3162D"/>
      <stop offset="1" stop-color="#4E0914"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#FFF6EC"/>
      <stop offset="0.5" stop-color="#F0D9C4"/>
      <stop offset="1" stop-color="#C79A80"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A97C66"/>
      <stop offset="0.5" stop-color="#D8B9A2"/>
      <stop offset="1" stop-color="#E9CDB6"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3A1A20"/>
      <stop offset="0.6" stop-color="#160A0C"/>
      <stop offset="1" stop-color="#080405"/>
    </linearGradient>
    <linearGradient id="velvet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0485F"/>
      <stop offset="0.45" stop-color="#B0182F"/>
      <stop offset="1" stop-color="#560915"/>
    </linearGradient>
    <linearGradient id="doublet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B0D17"/>
      <stop offset="1" stop-color="#12050A"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9C6E17"/>
      <stop offset="0.5" stop-color="#F2CF6E"/>
      <stop offset="1" stop-color="#FFF6D6"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E0263F" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#E0263F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lace" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.7" stop-color="#F1E8D4"/>
      <stop offset="1" stop-color="#CDBE9C"/>
    </radialGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D72A44"/>
      <stop offset="0.5" stop-color="#8E1428"/>
      <stop offset="1" stop-color="#4A0812"/>
    </linearGradient>
    <linearGradient id="maskShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E4A3A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6E4A3A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="0" dy="6" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="arch"><path d="M96 636 L96 214 A154 154 0 0 1 404 214 L404 636 Z"/></clipPath>
    <pattern id="lattice" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 L0 14" stroke="#E3B23C" stroke-width="0.8" stroke-opacity="0.12"/>
    </pattern>

    <!-- Halves that are mirrored to make the whole. -->
    <path id="hairBack" d="M250 226 C 204 226, 178 254, 176 296 C 174 330, 180 358, 174 384 C 170 398, 162 408, 158 416 C 156 424, 164 428, 172 424 C 186 418, 200 408, 210 396 C 216 388, 220 382, 222 378 L 250 378 Z"/>
    <path id="sleeveHalf" d="M116 600 L116 556 C 116 516, 138 490, 172 484 C 196 480, 212 496, 210 518 C 208 546, 196 572, 178 590 C 160 604, 134 608, 116 600 Z"/>
    <path id="lock" d="M252 258 C 226 258, 204 272, 196 298 C 192 314, 194 332, 200 346 C 186 332, 182 310, 186 290 C 194 262, 220 248, 252 250 Z"/>
    <path id="maskHalf" d="M250 316 C 238 308, 218 302, 196 302 C 184 302, 172 297, 162 288 C 164 306, 174 324, 190 338 C 204 350, 222 354, 237 349 C 243 347, 246 344, 250 346 Z"/>
    <path id="eyeHole" d="M203 320 C 214 314, 231 317, 242 328 C 229 333, 213 331, 203 320 Z"/>
    <path id="collarHalf" d="M226 452 L 164 400 C 158 395, 150 398, 151 406 L 170 470 C 190 466, 210 460, 232 458 Z"/>
  </defs>

  <!-- the card: black stock, gold edges, a faint lattice in the margin -->
  <rect x="3" y="3" width="494" height="694" rx="34" fill="#0C090A"/>
  <rect x="3" y="3" width="494" height="694" rx="34" fill="url(#lattice)"/>
  <rect x="3" y="3" width="494" height="694" rx="34" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <rect x="15" y="15" width="470" height="670" rx="24" fill="none" stroke="#E3B23C" stroke-opacity="0.35" stroke-width="1.2"/>

  <g clip-path="url(#arch)">
    <rect x="90" y="50" width="320" height="600" fill="url(#field)"/>
    <g fill="#F2CF6E" opacity="0.16"><path d="M250 330 L669.79 316.81 L669.79 343.19 Z"/><path d="M250 330 L576.87 375.36 L574.89 387.87 Z"/><path d="M250 330 L653.32 447.18 L645.17 472.27 Z"/><path d="M250 330 L546.85 474.14 L541.1 485.43 Z"/><path d="M250 330 L597.37 566.08 L581.87 587.42 Z"/><path d="M250 330 L487.78 558.82 L478.82 567.78 Z"/><path d="M250 330 L507.42 661.87 L486.08 677.37 Z"/><path d="M250 330 L405.43 621.1 L394.14 626.85 Z"/><path d="M250 330 L392.27 725.17 L367.18 733.32 Z"/><path d="M250 330 L307.87 654.89 L295.36 656.87 Z"/><path d="M250 330 L263.19 749.79 L236.81 749.79 Z"/><path d="M250 330 L204.64 656.87 L192.13 654.89 Z"/><path d="M250 330 L132.82 733.32 L107.73 725.17 Z"/><path d="M250 330 L105.86 626.85 L94.57 621.1 Z"/><path d="M250 330 L13.92 677.37 L-7.42 661.87 Z"/><path d="M250 330 L21.18 567.78 L12.22 558.82 Z"/><path d="M250 330 L-81.87 587.42 L-97.37 566.08 Z"/><path d="M250 330 L-41.1 485.43 L-46.85 474.14 Z"/><path d="M250 330 L-145.17 472.27 L-153.32 447.18 Z"/><path d="M250 330 L-74.89 387.87 L-76.87 375.36 Z"/><path d="M250 330 L-169.79 343.19 L-169.79 316.81 Z"/><path d="M250 330 L-76.87 284.64 L-74.89 272.13 Z"/><path d="M250 330 L-153.32 212.82 L-145.17 187.73 Z"/><path d="M250 330 L-46.85 185.86 L-41.1 174.57 Z"/><path d="M250 330 L-97.37 93.92 L-81.87 72.58 Z"/><path d="M250 330 L12.22 101.18 L21.18 92.22 Z"/><path d="M250 330 L-7.42 -1.87 L13.92 -17.37 Z"/><path d="M250 330 L94.57 38.9 L105.86 33.15 Z"/><path d="M250 330 L107.73 -65.17 L132.82 -73.32 Z"/><path d="M250 330 L192.13 5.11 L204.64 3.13 Z"/><path d="M250 330 L236.81 -89.79 L263.19 -89.79 Z"/><path d="M250 330 L295.36 3.13 L307.87 5.11 Z"/><path d="M250 330 L367.18 -73.32 L392.27 -65.17 Z"/><path d="M250 330 L394.14 33.15 L405.43 38.9 Z"/><path d="M250 330 L486.08 -17.37 L507.42 -1.87 Z"/><path d="M250 330 L478.82 92.22 L487.78 101.18 Z"/><path d="M250 330 L581.87 72.58 L597.37 93.92 Z"/><path d="M250 330 L541.1 174.57 L546.85 185.86 Z"/><path d="M250 330 L645.17 187.73 L653.32 212.82 Z"/><path d="M250 330 L574.89 272.13 L576.87 284.64 Z"/></g>
    <path d="M132 163 Q133.26 168.74 139 170 Q133.26 171.26 132 177 Q130.74 171.26 125 170 Q130.74 168.74 132 163 Z" fill="#FBE7A1" opacity="0.8"/><path d="M150 116 Q150.72 119.28 154 120 Q150.72 120.72 150 124 Q149.28 120.72 146 120 Q149.28 119.28 150 116 Z" fill="#FBE7A1" opacity="0.6"/><path d="M372 296 Q372.72 299.28 376 300 Q372.72 300.72 372 304 Q371.28 300.72 368 300 Q371.28 299.28 372 296 Z" fill="#FBE7A1" opacity="0.55"/><path d="M124 465 Q124.9 469.1 129 470 Q124.9 470.9 124 475 Q123.1 470.9 119 470 Q123.1 469.1 124 465 Z" fill="#FBE7A1" opacity="0.5"/><path d="M378 446 Q379.08 450.92 384 452 Q379.08 453.08 378 458 Q376.92 453.08 372 452 Q376.92 450.92 378 446 Z" fill="#FBE7A1" opacity="0.6"/>

    <!-- the heart halo -->
    <use href="#heart" transform="translate(113 188) scale(2.74)" fill="url(#halo)"/>
    <use href="#heart" transform="translate(113 188) scale(2.74)" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
    <use href="#heart" transform="translate(126 202) scale(2.48)" fill="none" stroke="#FBE7A1" stroke-opacity="0.55" stroke-width="0.6"/>
    <use href="#heart" transform="translate(101 175) scale(2.98)" fill="none" stroke="#F2CF6E" stroke-width="0.9" stroke-dasharray="0.1 6" stroke-linecap="round"/>

    <g filter="url(#shadow)">
      <!-- the plume, behind the beret -->
      <path d="M318 250 C 332 198, 350 156, 380 104 C 386 136, 378 176, 364 206 C 352 230, 336 246, 318 250 Z" fill="url(#plume)" stroke="#5A3D0C" stroke-width="1"/>
      <path d="M322 246 C 340 196, 356 156, 378 112" fill="none" stroke="#FFF8E1" stroke-width="1.4" stroke-linecap="round"/>
      <g stroke="#7A5410" stroke-width="1" opacity="0.55" stroke-linecap="round">
        <path d="M338 214 L 356 200"/><path d="M346 192 L 364 176"/><path d="M354 170 L 370 152"/><path d="M362 150 L 376 132"/>
      </g>
      <path d="M312 246 C 314 206, 322 172, 338 138 C 344 162, 340 194, 330 218 Z" fill="#FFF6E2" opacity="0.85" stroke="#C9A55B" stroke-width="0.8"/>

      <!-- wavy hair to the jaw, curling out at the ends -->
      <use href="#hairBack" fill="url(#hair)"/>
      <use href="#hairBack" transform="matrix(-1 0 0 1 500 0)" fill="url(#hair)"/>

      <!-- a velvet doublet: puffed crimson sleeves slashed with gold, gold buttons -->
      <path d="M116 640 L116 552 C 120 508, 158 480, 204 468 C 220 464, 232 460, 240 458 L 260 458 C 268 460, 280 464, 296 468 C 342 480, 380 508, 384 552 L 384 640 Z" fill="url(#sleeve)"/>
      <path d="M208 468 C 222 520, 236 580, 242 640 L 258 640 C 264 580, 278 520, 292 468 C 276 462, 262 460, 250 460 C 238 460, 224 462, 208 468 Z" fill="url(#doublet)" stroke="url(#gold)" stroke-width="2"/>
      <use href="#sleeveHalf" fill="url(#sleeve)" stroke="#3A0610" stroke-width="1"/>
      <use href="#sleeveHalf" transform="matrix(-1 0 0 1 500 0)" fill="url(#sleeve)" stroke="#3A0610" stroke-width="1"/>
      <g fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round">
        <path d="M140 500 C 132 530, 130 568, 136 600"/><path d="M162 488 C 156 524, 156 566, 160 598"/><path d="M186 486 C 186 520, 182 556, 176 586"/>
        <path d="M360 500 C 368 530, 370 568, 364 600"/><path d="M338 488 C 344 524, 344 566, 340 598"/><path d="M314 486 C 314 520, 318 556, 324 586"/>
      </g>
      
      <g fill="url(#goldV)" stroke="#4A2F06" stroke-width="0.8">
        <circle cx="250" cy="592" r="4.2"/><circle cx="250" cy="614" r="4.2"/>
      </g>
      <!-- a gold chain with a ruby heart -->
      <path d="M204 486 C 216 528, 232 546, 250 550 C 268 546, 284 528, 296 486" fill="none" stroke="url(#gold)" stroke-width="2.6" stroke-dasharray="4 3"/>
      <use href="#heart" transform="translate(236 546) scale(0.28)" fill="#E0263F" stroke="#FBE7A1" stroke-width="5" filter="url(#soft)"/>

      <!-- the neck, going into a white ruff -->
      <path d="M229 392 C 230 410, 228 432, 225 452 L 275 452 C 272 432, 270 410, 271 392 Z" fill="url(#neck)"/>
      <path d="M308 450 Q314.4 453.01 306.02 454.66 Q310.02 458.82 300.23 459 Q301.54 464.03 291.01 462.73 Q289.55 468.28 279 465.59 Q274.86 471.29 265.01 467.39 Q258.48 472.84 250 468 Q241.52 472.84 234.99 467.39 Q225.14 471.29 221 465.59 Q210.45 468.28 208.99 462.73 Q198.46 464.03 199.77 459 Q189.98 458.82 193.98 454.66 Q185.6 453.01 192 450 Q185.6 446.99 193.98 445.34 Q189.98 441.18 199.77 441 Q198.46 435.97 208.99 437.27 Q210.45 431.72 221 434.41 Q225.14 428.71 234.99 432.61 Q241.52 427.16 250 432 Q258.48 427.16 265.01 432.61 Q274.86 428.71 279 434.41 Q289.55 431.72 291.01 437.27 Q301.54 435.97 300.23 441 Q310.02 441.18 306.02 445.34 Q314.4 446.99 308 450 Z" fill="url(#lace)" stroke="#B9A57E" stroke-width="1"/>
      <path d="M276.1 450 L308 450 M275.21 452.1 L306.02 454.66 M272.6 454.05 L300.23 459 M268.46 455.73 L291.01 462.73 M263.05 457.01 L279 465.59 M256.76 457.82 L265.01 467.39 M250 458.1 L250 468 M243.24 457.82 L234.99 467.39 M236.95 457.01 L221 465.59 M231.54 455.73 L208.99 462.73 M227.4 454.05 L199.77 459 M224.79 452.1 L193.98 454.66 M223.9 450 L192 450 M224.79 447.9 L193.98 445.34 M227.4 445.95 L199.77 441 M231.54 444.27 L208.99 437.27 M236.95 442.99 L221 434.41 M243.24 442.18 L234.99 432.61 M250 441.9 L250 432 M256.76 442.18 L265.01 432.61 M263.05 442.99 L279 434.41 M268.46 444.27 L291.01 437.27 M272.6 445.95 L300.23 441 M275.21 447.9 L306.02 445.34" fill="none" stroke="#BFAE8C" stroke-width="1" opacity="0.85"/>
      <ellipse cx="250" cy="448" rx="20.88" ry="6.48" fill="#8E5E4A" opacity="0.22"/>

      <!-- the face: a firm jaw, lit red from the halo on one side -->
      <path d="M250 262 C 279 262, 301 282, 303 312 C 305 340, 301 362, 291 380 C 282 395, 266 405, 250 406 C 234 405, 218 395, 209 380 C 199 362, 195 340, 197 312 C 199 282, 221 262, 250 262 Z" fill="url(#skin)" stroke="#8E5E4A" stroke-width="1"/>
      <path d="M268 262 C 290 270, 302 290, 303 312 C 305 340, 301 362, 291 380 C 284 392, 274 400, 262 404" fill="none" stroke="#FF4D66" stroke-width="3" opacity="0.4" filter="url(#soft)"/>
      <path d="M203 352 C 208 372, 220 392, 236 400" fill="none" stroke="#B88A72" stroke-width="1.4" opacity="0.4" stroke-linecap="round"/>
      <path d="M197 338 C 220 352, 280 352, 303 338 L 303 372 C 280 362, 220 362, 197 372 Z" fill="url(#maskShadow)"/>
      <ellipse cx="216" cy="362" rx="16" ry="9" fill="url(#blush)"/>
      <ellipse cx="284" cy="362" rx="16" ry="9" fill="url(#blush)"/>
      <!-- nose -->
      <path d="M247 348 C 245 356, 242 362, 245 366 C 248 369, 253 369, 256 366" fill="none" stroke="#A8775F" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M255 348 C 258 355, 259 360, 257 364" fill="none" stroke="#B88A72" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
      <!-- a thin smile, higher on one side, under a curled moustache; a small goatee -->
      <path d="M238 385 Q 251 383.5, 264 379 Q 257 389.5, 248 389 Q 241 388.5, 238 385 Z" fill="#A24B55"/>
      <path d="M238 385 Q 251 384, 264 379" fill="none" stroke="#4A0E16" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M250 374 C 245 372.5, 238 372.5, 233 375 C 229 377, 225 376.5, 223 373.5 C 224 379, 230 380.5, 235 379 C 240 377.5, 245 377, 250 377.5 Z" fill="#1A0C0E"/>
      <path d="M250 374 C 255 372.5, 262 372.5, 267 375 C 271 377, 275 376.5, 277 373.5 C 276 379, 270 380.5, 265 379 C 260 377.5, 255 377, 250 377.5 Z" fill="#1A0C0E"/>
      <path d="M246.5 395 Q 250 403, 253.5 395 Q 250 397, 246.5 395 Z" fill="#1A0C0E"/>

      <!-- hair over the temples -->
      <use href="#lock" fill="url(#hair)"/>
      <use href="#lock" transform="matrix(-1 0 0 1 500 0)" fill="url(#hair)"/>
      <g fill="none" stroke="#E3B23C" stroke-width="1.1" opacity="0.45" stroke-linecap="round">
        <path d="M188 304 C 184 340, 186 380, 172 408"/><path d="M196 300 C 194 330, 196 360, 190 392"/>
        <path d="M312 304 C 316 340, 314 380, 328 408"/><path d="M304 300 C 306 330, 304 360, 310 392"/>
      </g>

      <!-- the gold mask, narrow red eyes, sharp brows -->
      <use href="#maskHalf" fill="url(#mask)" stroke="#6B4A0E" stroke-width="1.2"/>
      <use href="#maskHalf" transform="matrix(-1 0 0 1 500 0)" fill="url(#mask)" stroke="#6B4A0E" stroke-width="1.2"/>
      <g fill="none" stroke="#8A6212" stroke-width="1" opacity="0.8" stroke-linecap="round">
        <path d="M172 300 C 180 312, 192 318, 204 316"/><path d="M328 300 C 320 312, 308 318, 296 316"/>
        <path d="M196 340 C 206 344, 218 346, 228 344"/><path d="M304 340 C 294 344, 282 346, 272 344"/>
      </g>
      <use href="#eyeHole" fill="#140307"/>
      <use href="#eyeHole" transform="matrix(-1 0 0 1 500 0)" fill="#140307"/>
      <circle cx="223" cy="323.5" r="4.4" fill="#FF2E4D" filter="url(#glow)"/>
      <circle cx="277" cy="323.5" r="4.4" fill="#FF2E4D" filter="url(#glow)"/>
      <circle cx="224.4" cy="322.2" r="1.3" fill="#FFF0F2"/>
      <circle cx="278.4" cy="322.2" r="1.3" fill="#FFF0F2"/>
      <g fill="none" stroke="#4A2F06" stroke-width="3.2" stroke-linecap="round">
        <path d="M198 308 L 242 318"/><path d="M302 308 L 258 318"/>
      </g>
      <circle cx="250" cy="318" r="4" fill="#E0263F" stroke="#FFF1C1" stroke-width="1.2" filter="url(#soft)"/>

      <!-- the beret, crimson velvet with a gold band and a ruby heart -->
      <path d="M188 272 C 174 252, 188 222, 226 208 C 264 194, 316 198, 340 214 C 360 228, 352 254, 318 266 C 284 276, 228 282, 188 272 Z" fill="url(#velvet)" stroke="#5A0915" stroke-width="1.2"/>
      <path d="M210 230 C 234 212, 276 204, 312 210" fill="none" stroke="#FF8FA0" stroke-width="2.4" stroke-linecap="round" opacity="0.5"/>
      <path d="M190 268 C 232 276, 286 272, 322 260 L 324 270 C 288 283, 232 287, 192 278 Z" fill="url(#goldV)" stroke="#4A2F06" stroke-width="0.8"/>
      <use href="#heart" transform="translate(212 260) scale(0.2)" fill="#E0263F" stroke="#FFF1C1" stroke-width="6" filter="url(#soft)"/>
    </g>
  </g>

  <!-- the arch: gold frame, a dotted outer line, a plinth at the foot with a heart -->
  <path d="M96 636 L96 214 A154 154 0 0 1 404 214 L404 636 Z" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <path d="M88 644 L88 214 A162 162 0 0 1 412 214 L412 644 Z" fill="none" stroke="#F2CF6E" stroke-width="2.2" stroke-dasharray="0.1 8" stroke-linecap="round" opacity="0.8"/>
  <path d="M104 636 L104 214 A146 146 0 0 1 396 214 L396 636" fill="none" stroke="#FBE7A1" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="96" y="604" width="308" height="32" fill="#0C090A"/>
  <path d="M96 604 L404 604 M96 610 L404 610" stroke="url(#gold)" stroke-width="1.4"/>
  <circle cx="250" cy="608" r="17" fill="#0C090A" stroke="url(#gold)" stroke-width="2.4"/>
  <use href="#heart" transform="translate(240.5 599.5) scale(0.19)" fill="#E0263F" filter="url(#soft)"/>

  <!-- indices -->
  <g id="index">
    <text x="49" y="104" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-weight="700" font-size="78" fill="#E0263F" stroke="#FBE7A1" stroke-width="1.1" filter="url(#soft)">J</text>
    <use href="#heart" transform="translate(30 118) scale(0.38)" fill="#E0263F" filter="url(#soft)"/>
  </g>
  <use href="#index" transform="rotate(180 250 350)"/>
</svg>
